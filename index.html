<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + SolidJS + TS</title>
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="/src/index.ts"></script>
  </head>
  <body class="theme-dark">
    <div id="theme-toolbar">
      <button id="themeToggle">☀️ Light Mode</button>
    </div>
    
    <as-box id="mainBox" theme="dark">
      <as-input label="Name" value="John"></as-input>
      <as-input label="Last Name" value="Doe"></as-input>
      <as-text label="Comments" rows="3" placeholder="Enter your comments"></as-text>
      <as-date label="Birth Date" placeholder="Select date"></as-date>
      <as-time label="Meeting Time" placeholder="Select time"></as-time>
      <as-check label="Check me"></as-check>
      <as-switch label="Switch me"></as-switch>
      <as-radio options="label=A,value=A;label=B,value=B;label=C,value=C"></as-radio>
      <as-select options="label=A,value=A;label=B,value=B;label=C,value=C"></as-select>
      <as-complete label="Buscar" options="label=JavaScript,value=js;label=TypeScript,value=ts;label=Python,value=py;label=Java,value=java"></as-complete>
      <as-event id="eventField" label="Acciones" placeholder="Select action" event="show-menu"></as-event>
      <as-confirm label="Tap me" message="Hey there!"></as-confirm>
      <as-modal id="testModal" title="Registro de Usuario" theme="dark">
        <as-form id="userForm"></as-form>
      </as-modal>
      <as-button id="openModalBtn" label="Open Modal Form"></as-button>
      <as-datagrid id="table" actionable theme="dark"></as-datagrid>
    </as-box>

    <as-cards id="cardsDemo" filtering title="Common/Componentes User Interface (CUI)" theme="dark" style="margin-top: 1rem; max-width: 900px;"></as-cards>

    <script type="module">
      // ── Theme toggle ──────────────────────────────────────────
      const mainBox = document.getElementById('mainBox');
      const toggleBtn = document.getElementById('themeToggle');
      const testModal = document.getElementById('testModal');
      const tableEl = document.getElementById('table');
      const cardsDemo = document.getElementById('cardsDemo');

      toggleBtn.addEventListener('click', () => {
        const isDark = mainBox.getAttribute('theme') !== 'light';
        const newTheme = isDark ? 'light' : 'dark';

        // Container cascades to slotted children
        mainBox.setAttribute('theme', newTheme);

        // Components with explicit theme attributes
        testModal.setAttribute('theme', newTheme);
        tableEl.setAttribute('theme', newTheme);
        cardsDemo.setAttribute('theme', newTheme);

        // Body background
        document.body.className = `theme-${newTheme}`;

        // Button text
        toggleBtn.textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
      });

      // ── Rest of setup ─────────────────────────────────────────
      const table = tableEl;
      table.data = Array.from({length: 57}, (_, i) => ({
        id: i + 1,
        name: `Usuario ${i + 1}`,
        email: `user${i + 1}@ejemplo.com`,
        role: ['Admin', 'Editor', 'Viewer'][Math.floor(Math.random()*3)],
        status: Math.random() > 0.5 ? 'Activo' : 'Inactivo'
      }));
      table.columns = [
        { key: 'name', header: 'Nombre' },
        { key: 'email', header: 'Correo' },
        { key: 'role', header: 'Rol' },
        { key: 'status', header: 'Estado' }
      ];
      table.selectable = true;
      table.filterable = true;
      table.pageable = true;
      // Crear popup menu
      const popup = document.createElement('as-popup');
      popup.options = 'label=Editar,value=edit;label=Duplicar,value=duplicate;label=Eliminar,value=delete';
      document.body.appendChild(popup);
      
      table.addEventListener('row-action', (e) => {
        console.log('Action on row:', e.detail);
        const mouseEvent = e.detail.event;
        popup.show(mouseEvent.clientX, mouseEvent.clientY);
        
        // Guardar referencia de la fila para usar en el evento
        popup._currentRow = e.detail.row;
      });
      
      popup.addEventListener('option-select', (e) => {
        const action = e.detail.value;
        const row = popup._currentRow;
        alert(`${e.detail.label}: ${row.name}`);
      });
      
      // Ejemplo de as-event con as-popup
      const eventField = document.getElementById('eventField');
      const eventPopup = document.createElement('as-popup');
      eventPopup.options = 'label=Configurar,value=config;label=Exportar,value=export;label=Resetear,value=reset';
      document.body.appendChild(eventPopup);
      
      eventField.addEventListener('show-menu', (e) => {
        // Obtener posición del campo as-event
        const rect = eventField.getBoundingClientRect();
        eventPopup.show(rect.right, rect.bottom);
      });
      
      eventPopup.addEventListener('option-select', (e) => {
        eventField.value = e.detail.label;
        alert(`Acción seleccionada: ${e.detail.label}`);
      });
      
      // Configurar formulario en modal
      const userForm = document.getElementById('userForm');
      const openModalBtn = document.getElementById('openModalBtn');
      
      userForm.schema = {
        title: 'User Registration',
        sections: [
          {
            title: 'Personal Information',
            fields: [
              {
                name: 'firstName',
                type: 'text',
                label: 'First Name',
                required: true,
                validation: ['required', 'min:2']
              },
              {
                name: 'lastName',
                type: 'text',
                label: 'Last Name',
                required: true,
                validation: ['required', 'min:2']
              },
              {
                name: 'email',
                type: 'email',
                label: 'Email',
                required: true,
                validation: ['required', 'email']
              }
            ]
          },
          {
            title: 'Preferences',
            fields: [
              {
                name: 'newsletter',
                type: 'switch',
                label: 'Subscribe to newsletter'
              },
              {
                name: 'role',
                type: 'select',
                label: 'Role',
                options: [
                  { label: 'User', value: 'user' },
                  { label: 'Admin', value: 'admin' },
                  { label: 'Editor', value: 'editor' }
                ]
              }
            ]
          }
        ]
      };
      
      openModalBtn.addEventListener('button-tap', () => {
        testModal.show();
      });
      
      userForm.addEventListener('form-submit', (e) => {
        console.log('Form submitted:', e.detail.formData);
        alert('Form submitted successfully!');
        testModal.hide();
      });
      
      userForm.addEventListener('form-cancel', () => {
        testModal.hide();
      });
      
      // ── as-cards demo ────────────────────────────────────────
      cardsDemo.items = [
        { title: 'as-input', description: 'Text input with label, supports text/email/password/number', tags: ['form', 'input'], url: '#' },
        { title: 'as-text', description: 'Multi-line textarea with label and rows', tags: ['form', 'input'], url: '#' },
        { title: 'as-select', description: 'Dropdown select with options format', tags: ['form', 'select'], url: '#' },
        { title: 'as-complete', description: 'Autocomplete/combobox with filtering', tags: ['form', 'select'], url: '#' },
        { title: 'as-date', description: 'Date picker with calendar dropdown', tags: ['form', 'picker'], url: '#' },
        { title: 'as-time', description: 'Time picker with hour/minute/AM-PM selectors', tags: ['form', 'picker'], url: '#' },
        { title: 'as-check', description: 'Single checkbox with label', tags: ['form', 'toggle'], url: '#' },
        { title: 'as-switch', description: 'Toggle switch component', tags: ['form', 'toggle'], url: '#' },
        { title: 'as-radio', description: 'Radio button group', tags: ['form', 'select'], url: '#' },
        { title: 'as-upload', description: 'File upload with drag-and-drop', tags: ['form', 'upload'], url: '#' },
        { title: 'as-button', description: 'Common button with label, link, and variants', tags: ['action'], url: '#' },
        { title: 'as-confirm', description: 'Button with confirmation dialog', tags: ['action'], url: '#' },
        { title: 'as-event', description: 'Input button that dispatches custom events', tags: ['action'], url: '#' },
        { title: 'as-box', description: 'Container card for grouping components', tags: ['layout'], url: '#' },
        { title: 'as-modal', description: 'Modal dialog with slot for content', tags: ['layout'], url: '#' },
        { title: 'as-popup', description: 'Context menu with smart positioning', tags: ['layout'], url: '#' },
        { title: 'as-datagrid', description: 'Data table with sort, filter, pagination', tags: ['data'], url: '#' },
        { title: 'as-form', description: 'Schema-driven form with validation', tags: ['data', 'form'], url: '#' },
        { title: 'as-cards', description: 'Card index with filtering and tag search', tags: ['data', 'layout'], url: '#' },
        { title: 'as-image', description: 'Centered image display', tags: ['media'], url: '#' },
        { title: 'as-video', description: 'Video embed for YouTube/Vimeo', tags: ['media'], url: '#' },
        { title: 'as-embed', description: 'Responsive iframe embed (16:9)', tags: ['media'], url: '#' }
      ];
    </script>
  </body>
</html>
